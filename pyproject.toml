[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dotseal"
# Bumped dynamically from the git tag during release — see .github/workflows/publish.yml
version = "0.0.0"
description = "Git-friendly encrypted .env files with cleartext keys and sealed values (SOPS-inspired structural encryption)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dotseal contributors" }]
keywords = ["dotenv", "dotseal", "env", "encryption", "secrets", "sops", "aes-gcm", "configuration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # A range, not an exact pin: dotseal is a library, and an == pin forces
    # version conflicts onto every consumer.
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/Jastchi/dotseal"
Repository = "https://github.com/Jastchi/dotseal"
Changelog = "https://github.com/Jastchi/dotseal/releases"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1; python_version < '3.10'",  # renovate: ignore
    "pytest==9.1.1; python_version >= '3.10'",
    "pytest-cov",
    "ruff==0.15.16",
    "ty==0.0.47",
]

[project.scripts]
dotseal = "dotseal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dotseal"]

[tool.ruff.lint]
# Ruff's default set (E4, E7, E9, F) plus:
#   UP  - keep the PEP 585/604 annotations from drifting back to typing.List
#   I   - import sorting
#   B   - flake8-bugbear, real bug patterns rather than style
#   SIM - obvious simplifications
#   RUF - ruff's own checks
# Deliberately not "ALL": it lands ~1800 violations here, most of them
# docstring/annotation mandates plus COM812 and E501, which fight the
# formatter.
select = ["E4", "E7", "E9", "F", "UP", "I", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
